# ===================================================
# CONFIGURACION PARA PRODUCCION - Gestor de Tareas
# ===================================================
# Este archivo se usa cuando la aplicacion se despliega en Railway

# Configuracion del Servidor
server.port=${PORT:8080}
server.address=0.0.0.0

# Configuracion de Base de Datos PostgreSQL (Railway)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion JPA para produccion
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Configuracion de CORS para produccion
cors.allowed.origins=${FRONTEND_URL:https://tu-frontend.vercel.app}

# Configuracion de logging para produccion
logging.level.root=INFO
logging.level.com.pdauf.gestortareas=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Seguridad - Ocultar errores en produccion
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never

# Encoding
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
